<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0A0B10">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="유리">
<title>유리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&family=Noto+Sans+KR:wght@300&family=Josefin+Sans:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="rain" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

<main class="gate" id="gate" hidden>
  <div class="gate-card">
    <div class="hero"><h1 class="logo-k glow" lang="ko">유리</h1><div class="logo-r" aria-hidden="true"><span lang="ko">유리</span></div><p class="ym">YURI</p></div>
    <form id="loginForm">
      <label for="email">メールアドレス</label>
      <input type="email" id="email" autocomplete="username" required>
      <label for="password">パスワード</label>
      <input type="password" id="password" autocomplete="current-password" required>
      <button class="btn" type="submit">入る</button>
    </form>
    <p class="hint" id="gateMsg" aria-live="polite"></p>
  </div>
</main>

<div id="app" hidden>
  <header class="top">
    <nav class="crumbs" id="crumbs" aria-label="今いる場所"></nav>
    <input type="search" id="q" placeholder="探す（例：実査、240やる）" aria-label="探す" enterkeyhint="search" autocomplete="off">
  </header>
  <main id="view" class="view"></main>
  <footer class="foot"><span id="status" aria-live="polite"></span><button class="btn ghost small" data-act="import">取り込む</button><button class="btn ghost small" data-act="logout">出る</button></footer>
</div>

<div class="modal" id="modal" hidden></div>
<div class="toast" id="toast" role="status"></div>
<button class="markbtn" id="markBtn" data-act="mark" hidden></button>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
