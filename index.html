<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="vitrine">
<title>vitrine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="gate" id="gate" hidden>
  <div class="gate-card">
    <h1 class="logo">vitrine</h1>
    <form id="loginForm">
      <label for="email">メールアドレス</label>
      <input type="email" id="email" autocomplete="username" required>
      <label for="password">パスワード</label>
      <input type="password" id="password" autocomplete="current-password" required>
      <button class="btn" type="submit">入る</button>
    </form>
    <p class="hint" id="gateMsg" aria-live="polite"></p>
  </div>
</main>

<div id="app" hidden>
  <header class="top">
    <nav class="crumbs" id="crumbs" aria-label="今いる場所"></nav>
    <input type="search" id="q" placeholder="探す（例：実査、240やる）" aria-label="探す" enterkeyhint="search" autocomplete="off">
  </header>
  <main id="view" class="view"></main>
  <footer class="foot"><span id="status" aria-live="polite"></span><button class="btn ghost small" data-act="logout">出る</button></footer>
</div>

<div class="modal" id="modal" hidden></div>
<div class="toast" id="toast" role="status"></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
